<p>Table is just a mapping of objects to table rows with <code>ngFor</code></p>

<table class="table table-striped">
	<thead>
		<tr>
			<th scope="col">#</th>
			<th scope="col">Layout Name</th>
			<th scope="col">Created By</th>
			<th scope="col">Created On</th>
            <th scope="col">Actions</th>
		</tr>
	</thead>
	<tbody>
		<tr *ngFor="let layout of layouts; index as i">
			<th scope="row">{{ i + 1 }}</th>
			<td>{{ layout.name }}</td>
			<td>{{ layout.creator }}</td>
			<td>{{ layout.createdOn | date }}</td>
            <td><img src="../assets/trash-fill.svg" alt="delete logo" (click)="delete()"/><img src="../assets/Dabob.webp"/><img src="../assets/pencil-fill.svg" alt="edit logo" (click)="edit()"/></td>
		</tr>
	</tbody>
</table>

<div class="d-flex justify-content-between p-2">
	<ngb-pagination
		[collectionSize]="collectionSize"
		[(page)]="page"
		[pageSize]="pageSize"
		(pageChange)="refreshCountries()"
	>
	</ngb-pagination>

 </div>
